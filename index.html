<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jeopardy!</title>
  <meta name="description" content="A seven-category Jeopardy board for game night.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <h1 class="logo">Jeopardy<span>!</span></h1>
    <div class="topbar-actions">
      <span class="progress" id="progress" aria-live="polite"></span>
    </div>
  </header>

  <main class="stage">
    <div class="board" id="board"></div>
  </main>

  <footer class="scoreboard" id="scoreboard" aria-label="Scoreboard"></footer>

  <script src="js/questions.js"></script>
  <script src="js/store.js"></script>
  <script src="js/board.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
