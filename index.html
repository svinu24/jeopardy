<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jeopardy!</title>
  <meta name="description" content="A seven-category Jeopardy board for game night.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <h1 class="logo">Jeopardy<span>!</span></h1>
    <div class="topbar-actions">
      <span class="progress" id="progress" aria-live="polite"></span>
      <button type="button" class="btn btn-ghost btn-sm" id="teams-btn">Teams</button>
      <button type="button" class="btn btn-ghost btn-sm" id="reset-btn">Reset</button>
    </div>
  </header>

  <main class="stage">
    <div class="board" id="board"></div>
  </main>

  <footer class="scoreboard" id="scoreboard" aria-label="Scoreboard"></footer>

  <div class="overlay" id="clue-overlay" hidden>
    <section class="clue-card" id="clue-card" role="dialog" aria-modal="true" aria-labelledby="clue-category">
      <header class="clue-meta">
        <span class="clue-category" id="clue-category"></span>
        <span class="clue-value" id="clue-value"></span>
      </header>
      <div class="clue-body">
        <div class="clue-question" id="clue-question"></div>
        <div class="clue-answer" id="clue-answer" hidden></div>
      </div>
      <div class="clue-scoring" id="clue-scoring" aria-label="Award or deduct points"></div>
      <footer class="clue-actions">
        <button type="button" class="btn btn-ghost btn-lg" id="clue-close">Back to Board</button>
        <button type="button" class="btn btn-gold btn-lg" id="clue-reveal">Reveal Answer</button>
      </footer>
    </section>
  </div>

  <div class="overlay" id="setup-overlay" hidden>
    <section class="panel" role="dialog" aria-modal="true" aria-labelledby="setup-title">
      <h2 class="panel-title" id="setup-title">Teams</h2>
      <p class="panel-sub">Add 2–6 teams and give them names.</p>
      <ol class="team-inputs" id="team-inputs"></ol>
      <button type="button" class="btn btn-ghost btn-sm" id="team-add">+ Add team</button>
      <div class="panel-actions">
        <button type="button" class="btn btn-ghost" id="setup-cancel">Cancel</button>
        <button type="button" class="btn btn-gold" id="setup-save">Start Game</button>
      </div>
    </section>
  </div>

  <div class="overlay" id="confirm-overlay" hidden>
    <section class="panel panel-sm" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-message">
      <h2 class="panel-title" id="confirm-title">Reset game?</h2>
      <p class="panel-sub" id="confirm-message">This clears every score and puts all clues back on the board. Team names are kept.</p>
      <div class="panel-actions">
        <button type="button" class="btn btn-ghost" id="confirm-cancel">Cancel</button>
        <button type="button" class="btn btn-danger" id="confirm-ok">Reset Game</button>
      </div>
    </section>
  </div>

  <script src="js/questions.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/teams.js"></script>
  <script src="js/clue.js"></script>
  <script src="js/board.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
